{% set info = load_file_data("uwtools/resources/info.json") %}
{% set pymin = "3.11" %} # keep in sync with docs/environment.yml

package:
  name: uwtools
  version: {{ info["version"] }}
source:
  path: ../src
build:
  include_recipe: false
  noarch: python
  number: 0 # do not increment
requirements:
  host:
    - pip
    - python {{ pymin }}
    - setuptools
  run:
    - ecflow 5.19.* # keep docs/conf.py in-sync
    - f90nml >=1.4
    - iotaa >=1.7
    - jinja2 >=3.0
    - jsonschema >=4.17
    - lxml >=5.2
    - python >={{ pymin }},<3.15
    - python-dateutil >=2.9
    - pyyaml >=6.0
    - requests >=2.32
test:
  requires:
    - docformatter 1.7.7.* # 1.7.8 is buggy
    - jq 1.8.*
    - lxml-stubs
    - make 4.4.*
    - mypy 2.4.*
    - pytest 9.1.*
    - pytest-cov 7.1.*
    - pytest-randomly 5.0.*
    - pytest-xdist 3.8.*
    - python {{ pymin }}
    - ruff 0.17.*
    - types-PyYAML
    - types-jsonschema
    - types-python-dateutil
    - types-requests
    - types-setuptools
about:
  license: APACHE
